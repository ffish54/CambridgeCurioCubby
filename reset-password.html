<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>New password | Curio Cubbyhole</title>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin-login-page">

  <main class="login-card">
    <img class="brand-mark" src="assets/images/curio-cubbyhole-logo.jpg" alt="Cambridge Curio Cubbyhole" width="1024" height="1024">
    <h1>New password</h1>
    <p id="reset-intro">Checking your reset link…</p>

    <form id="reset-form" hidden novalidate>
      <label class="visually-hidden" for="username">Email</label>
      <input id="username" name="username" type="email" autocomplete="username" class="visually-hidden">

      <label for="password">New password</label>
      <input id="password" name="new-password" type="password" required
             autocomplete="new-password" minlength="8">

      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm-password" type="password" required
             autocomplete="new-password" minlength="8">
      <p class="hint">At least 8 characters.</p>

      <button type="submit" id="save-password">Save new password</button>
    </form>

    <p id="reset-message" role="status" aria-live="polite"></p>
    <noscript><p>JavaScript is required to open a reset link.</p></noscript>

    <p class="login-footer">
      <a id="request-again" href="admin-login.html#forgot" hidden>Request a new reset link</a>
      <a href="admin-login.html">← Return to sign in</a>
    </p>
  </main>

  <script>
    (function () {
      var hash = new URLSearchParams(String(window.location.hash || "").replace(/^#/, ""));
      var query = new URLSearchParams(window.location.search);
      function pick(key) {
        return query.get(key) || hash.get(key) || "";
      }
      var previousAccessToken = "";
      try {
        var stored = JSON.parse(window.localStorage.getItem("sb-etiwnwqovlbcyxfpmpsv-auth-token") || "null");
        previousAccessToken = (stored && stored.access_token) || "";
      } catch (error) {
        previousAccessToken = "";
      }
      window.__authCallback = {
        type: pick("type"),
        error: pick("error"),
        errorCode: pick("error_code"),
        errorDescription: pick("error_description"),
        code: query.get("code") || "",
        tokenHash: pick("token_hash"),
        accessToken: pick("access_token"),
        refreshToken: pick("refresh_token"),
        previousAccessToken: previousAccessToken
      };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/reset-password.js"></script>
</body>
</html>
